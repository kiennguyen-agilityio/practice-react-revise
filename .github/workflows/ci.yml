name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR/branch makes the older run obsolete
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # checkout only

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The `prepare` script installs git hooks, which CI does not need
      HUSKY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
